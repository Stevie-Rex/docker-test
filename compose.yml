services:
 db:
  image: mariadb:11.4
  container_name: login-db
  restart: unless-stopped
  environment:
   MARIADB_ROOT_PASSWORD: root123
   MARIADB_DATABASE: logindb
   MARIADB_USER: stevie
   MARIADB_PASSWORD: steviepass
  ports:
   - "3306:3306"
  volumes:
   - db_data:/var/lib/mysql
   - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
 db_data: 

     