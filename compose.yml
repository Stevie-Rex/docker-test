services:
 db:
  image: mariadb:11.4
  container_name: login-db
  restart: unless-stopped
  environment:
   MARIADB_ROOT_PASSWORD: root123
   MARIADB_DATABASE: logindb
   MARIADB_USER: stevie
   MARIADB_PASSWORD: steviepass
  ports:
   - "3306:3306"
  volumes:
   - db_data:/var/lib/mysql
 adminer:
  image: adminer
  container_name: login_ui
  restart: unless-stopped
  ports: 
   - "8080:8080"
  depends_on:
   - db
 web:
  build: .
  container_name: login-web
  restart: unless-stopped
  ports:
   - "5001:5000"
  volumes:
   - .:/app

volumes:
 db_data: 

     