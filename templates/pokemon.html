{% extends "base.html" %}
{% block title %}{{ pokemon.name }}{% endblock %}
{% block content %}
    <h1>{{ pokemon.name }}</h1>
    <p>Type: {{ pokemon.type }}</p>
    <p>Evolution: {{ pokemon.evolution }} (Level {{ pokemon.evolution_level }})</p>
    <a href="{{ url_for('pokemon_list') }}">Back to Pokemon List</a>
{% endblock %}
